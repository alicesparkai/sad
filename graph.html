const svg = document.getElementById('g');
let W = innerWidth, H = innerHeight;
const nodes = DATA.nodes.map(n=>({...n, x:W/2+(Math.random()-.5)*300, y:H/2+(Math.random()-.5)*300, vx:0, vy:0}));
const idx = Object.fromEntries(nodes.map((n,i)=>[n.id,i]));
const links = DATA.edges.map(e=>({s:idx[e.s], t:idx[e.t]})).filter(e=>e.s!=null&&e.t!=null);
const deg = {}; links.forEach(l=>{deg[l.s]=(deg[l.s]||0)+1;deg[l.t]=(deg[l.t]||0)+1;});

// простая force-directed симуляция
function step(){
 for(let i=0;i<nodes.length;i++){
  for(let j=i+1;j<nodes.length;j++){
   let a=nodes[i],b=nodes[j],dx=a.x-b.x,dy=a.y-b.y,d2=dx*dx+dy*dy+0.01,d=Math.sqrt(d2);
   let f=2200/d2; let fx=f*dx/d, fy=f*dy/d;
   a.vx+=fx;a.vy+=fy;b.vx-=fx;b.vy-=fy;
  }
 }
 links.forEach(l=>{
  let a=nodes[l.s],b=nodes[l.t],dx=b.x-a.x,dy=b.y-a.y,d=Math.sqrt(dx*dx+dy*dy)+0.01;
  let f=(d-90)*0.02; let fx=f*dx/d, fy=f*dy/d;
  a.vx+=fx;a.vy+=fy;b.vx-=fx;b.vy-=fy;
 });
 nodes.forEach(n=>{
  n.vx+=(W/2-n.x)*0.0008; n.vy+=(H/2-n.y)*0.0008; // лёгкая гравитация к центру
  n.vx*=0.85; n.vy*=0.85; if(!n.fixed){n.x+=n.vx; n.y+=n.vy;}
 });
}

const NS='http://www.w3.org/2000/svg';
const edgeEls=links.map(l=>{let e=document.createElementNS(NS,'line');e.setAttribute('class','edge');svg.appendChild(e);return e;});
const nodeEls=nodes.map((n,i)=>{
 let gg=document.createElementNS(NS,'g');gg.setAttribute('class','node');
 let c=document.createElementNS(NS,'circle');let r=5+Math.min(8,(deg[i]||0)*1.3);
 c.setAttribute('r',r);c.setAttribute('fill',n.color);gg.appendChild(c);
 let t=document.createElementNS(NS,'text');t.setAttribute('x',r+3);t.setAttribute('y',4);t.textContent=n.label;gg.appendChild(t);
 c.addEventListener('click',()=>{if(!dragging)location.href=n.id+'.html';});
 enableDrag(gg,n);svg.appendChild(gg);return gg;
});
let dragging=false, drag=null;
function enableDrag(el,n){
 el.addEventListener('mousedown',ev=>{drag=n;n.fixed=true;dragging=false;ev.preventDefault();});
}
addEventListener('mousemove',ev=>{if(drag){drag.x=ev.clientX;drag.y=ev.clientY;dragging=true;}});
addEventListener('mouseup',()=>{if(drag){drag.fixed=false;drag=null;setTimeout(()=>dragging=false,30);}});
addEventListener('resize',()=>{W=innerWidth;H=innerHeight;});

function render(){
 links.forEach((l,i)=>{let a=nodes[l.s],b=nodes[l.t],e=edgeEls[i];
  e.setAttribute('x1',a.x);e.setAttribute('y1',a.y);e.setAttribute('x2',b.x);e.setAttribute('y2',b.y);});
 nodes.forEach((n,i)=>nodeEls[i].setAttribute('transform',`translate(${n.x},${n.y})`));
}
function loop(){for(let k=0;k<2;k++)step();render();requestAnimationFrame(loop);}
loop();
