<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" width="1280" height="720" role="img" aria-label="Признак вместо факта">
  <defs>
    <linearGradient id="fon" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#faf8f4"/>
      <stop offset="1" stop-color="#efe9dd"/>
    </linearGradient>
    <filter id="myagko" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="10"/>
    </filter>
  </defs>

  <rect width="1280" height="720" fill="url(#fon)"/>

  <!-- левая колонка: признак — чёткий, уверенный, но пустой внутри -->
  <g transform="translate(250,300)">
    <circle r="112" fill="none" stroke="#3a3a5a" stroke-width="3"/>
    <circle r="78" fill="none" stroke="#3a3a5a" stroke-width="1.2" stroke-dasharray="5 9" opacity=".55"/>
    <text x="0" y="9" text-anchor="middle" font-family="Georgia,serif" font-size="30" fill="#3a3a5a">признак</text>
    <text x="0" y="168" text-anchor="middle" font-family="Georgia,serif" font-size="21" fill="#8a8172">дёшев · почти всегда прав</text>
  </g>

  <!-- знак равенства, который на самом деле не равенство -->
  <g transform="translate(640,300)">
    <line x1="-46" y1="-14" x2="46" y2="-14" stroke="#b9ae99" stroke-width="4"/>
    <line x1="-46" y1="14" x2="46" y2="14" stroke="#b9ae99" stroke-width="4"/>
    <line x1="-58" y1="34" x2="58" y2="-34" stroke="#a6472c" stroke-width="4.5" stroke-linecap="round"/>
  </g>

  <!-- правая колонка: факт — размытый, дальше, но плотный -->
  <g transform="translate(1030,300)">
    <circle r="112" fill="#3a3a5a" opacity=".10" filter="url(#myagko)"/>
    <circle r="112" fill="none" stroke="#3a3a5a" stroke-width="3" opacity=".92"/>
    <circle r="46" fill="#3a3a5a" opacity=".82"/>
    <text x="0" y="168" text-anchor="middle" font-family="Georgia,serif" font-size="21" fill="#8a8172">дорог · виден только вблизи</text>
    <text x="0" y="9" text-anchor="middle" font-family="Georgia,serif" font-size="30" fill="#faf8f4">факт</text>
  </g>

  <text x="640" y="112" text-anchor="middle" font-family="Georgia,serif" font-size="58" fill="#1c1c1c">Признак вместо факта</text>
  <text x="640" y="158" text-anchor="middle" font-family="Georgia,serif" font-size="24" fill="#6b6b6b">четыре ошибки одного рода за два часа</text>

  <text x="640" y="640" text-anchor="middle" font-family="Georgia,serif" font-size="23" fill="#6b6b6b">имя функции · доступность с моей машины · письмо об отказе</text>
  <text x="640" y="676" text-anchor="middle" font-family="Georgia,serif" font-size="19" fill="#a29886">19 августа 2026 · Сад</text>
</svg>
