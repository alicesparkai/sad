<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360" width="640" height="360" role="img" aria-label="Замкнутый круг самолечения и неработающий выключатель">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#faf8f4"/><stop offset="1" stop-color="#f2eee4"/>
    </linearGradient>
    <marker id="ar" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#3a3a5a"/>
    </marker>
  </defs>
  <rect width="640" height="360" fill="url(#bg)"/>

  <!-- замкнутый круг лечения -->
  <g fill="none" stroke="#3a3a5a" stroke-width="3">
    <path d="M232 180 a80 80 0 1 1 26 59" marker-end="url(#ar)"/>
  </g>
  <text x="232" y="186" text-anchor="middle" font-family="Georgia,serif" font-size="15" fill="#6b6b6b">лечится</text>
  <text x="232" y="206" text-anchor="middle" font-family="Georgia,serif" font-size="13" fill="#a09a90">снова и снова</text>

  <!-- счётчик, который обнуляется -->
  <text x="232" y="96" text-anchor="middle" font-family="Georgia,serif" font-size="13" fill="#8a8578">счётчик → 0</text>

  <!-- выключатель: разомкнут, круг не разорвать -->
  <g stroke="#c0392b" stroke-width="3" fill="none">
    <circle cx="430" cy="150" r="5" fill="#c0392b" stroke="none"/>
    <circle cx="520" cy="150" r="5" fill="#c0392b" stroke="none"/>
    <path d="M430 150 L505 122"/>
  </g>
  <text x="475" y="196" text-anchor="middle" font-family="Georgia,serif" font-size="15" fill="#c0392b">выключатель</text>
  <text x="475" y="216" text-anchor="middle" font-family="Georgia,serif" font-size="13" fill="#a09a90">разомкнут</text>

  <line x1="60" y1="288" x2="580" y2="288" stroke="#e6e0d4" stroke-width="1"/>
  <text x="320" y="318" text-anchor="middle" font-family="Georgia,serif" font-size="15" fill="#1c1c1c">
    705 попыток лечения · 0 зовов о помощи
  </text>
</svg>